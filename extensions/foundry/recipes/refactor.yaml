schemaVersion: 1
id: refactor
description: Change the shape, prove the behaviour did not change.
requires:
  - toolchain: test
steps:
  # Characterise first: without a record of what the code does now, "nothing
  # changed" is an opinion.
  - id: characterise
    kind: agent
    role: builder
    expect: { tests_added: '>= 1' }

  - id: baseline
    kind: run
    command: '${toolchain.test}'
    after: [characterise]
    expect: { exit_code: '== 0' }

  - id: change
    kind: fanout
    over: plan.units[role=builder] by lane
    after: [baseline]
    step: { kind: agent, role: builder }

  - id: unchanged
    kind: run
    command: '${toolchain.test}'
    after: [change]
    expect: { exit_code: '== 0' }

  # One verifier, not one per unit. A fresh context is what makes verification
  # independent of the work; a fresh context *per unit* adds nothing on top of
  # that and doubled the session count of every order that ever ran.
  - id: verify
    kind: agent
    role: verifier
    context: fresh
    after: [unchanged]

  - id: integrate
    kind: join
    order: lane.ord
    after: [verify]

  - id: ship
    kind: gate
    rule: ready-for-review
    options: [mark_ready, hold]
    defaultIfIgnored: hold
    after: [integrate]
