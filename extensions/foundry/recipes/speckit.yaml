schemaVersion: 1
id: speckit
description: >
  The ten-stage specification pipeline, kept whole. Offered only where the
  repository actually has the toolkit installed.
requires:
  # One line replaces the whole plain-prose fallback table: where this is
  # absent the recipe is not offered, rather than silently becoming a
  # different pipeline.
  - path_exists: .specify
steps:
  - id: constitution
    kind: run
    command: /speckit-constitution
  - id: specify
    kind: run
    command: /speckit-specify
    after: [constitution]
  - id: clarify
    kind: run
    command: /speckit-clarify
    after: [specify]
  - id: plan
    kind: run
    command: /speckit-plan
    after: [clarify]
  - id: checklist
    kind: run
    command: /speckit-checklist
    after: [plan]
  - id: tasks
    kind: run
    command: /speckit-tasks
    after: [checklist]
  - id: analyze
    kind: run
    command: /speckit-analyze
    after: [tasks]
  - id: implement
    kind: run
    command: /speckit-implement
    after: [analyze]
  - id: verify
    kind: fanout
    over: plan.units
    after: [implement]
    step: { kind: agent, role: verifier, context: fresh }
  - id: inspect
    kind: agent
    role: inspector
    when: risk.triggers is not empty
    after: [verify]
  - id: integrate
    kind: join
    order: lane.ord
    after: [inspect]
  - id: ship
    kind: gate
    rule: ready-for-review
    options: [mark_ready, hold]
    defaultIfIgnored: hold
    after: [integrate]
