schemaVersion: 1
id: research
description: >
  A question whose answer is a document. Read the ground, write the answer
  with evidence, have a fresh reader check it against the criteria. The
  document ends as a Claude artifact; no pull request is opened (ADR 138).
effort: medium
requires: []
steps:
  - id: scout
    kind: agent
    role: scout

  - id: write
    kind: agent
    role: author
    after: [scout]

  # A fresh context is what makes the check independent of the writing.
  - id: verify
    kind: agent
    role: verifier
    context: fresh
    after: [write]
