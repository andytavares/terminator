schemaVersion: 1
id: standard
description: The default for work spanning more than one lane, or graded above P2.
# More than one lane, or graded above P2: one level above the model's default.
effort: high
requires: []
steps:
  - id: scout
    kind: agent
    role: scout
  # No `plan` step: the Forge's converge is the architect, and the order this
  # run is building from is the plan it already agreed. See direct.yaml.
  - id: challenge
    kind: agent
    role: red-team
    after: [scout]
  - id: build
    kind: fanout
    over: plan.units[role=builder] by lane
    after: [challenge]
    step: { kind: agent, role: builder }
  # Lint runs in the lane, not as a rung of its own: it costs a terminal
  # tab rather than a session, and catching it here is cheaper than a
  # review sending it back.
  - id: lint
    kind: run
    command: '${toolchain.lint}'
    when: toolchain.lint is set
    after: [build]
    onFail: { rework: build, max: 1 }
  # One verifier, not one per unit. A fresh context is what makes verification
  # independent of the work; a fresh context *per unit* adds nothing on top of
  # that and doubled the session count of every order that ever ran.
  - id: verify
    kind: agent
    role: verifier
    context: fresh
    after: [lint]
  - id: inspect
    kind: agent
    role: inspector
    when: risk.triggers is not empty
    after: [verify]
  - id: document
    kind: agent
    role: scribe
    after: [verify]
  - id: integrate
    kind: join
    order: lane.ord
    after: [inspect, document]
  - id: ship
    kind: gate
    rule: ready-for-review
    options: [mark_ready, hold]
    defaultIfIgnored: hold
    after: [integrate]
