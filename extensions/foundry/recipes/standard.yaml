schemaVersion: 1
id: standard
description: The default for anything with more than one unit of work.
requires: []
steps:
  - id: scout
    kind: agent
    role: scout
  - id: plan
    kind: agent
    role: architect
    after: [scout]
  - id: challenge
    kind: agent
    role: red-team
    after: [plan]
  - id: build
    kind: fanout
    over: plan.units[role=builder]
    after: [challenge]
    step: { kind: agent, role: builder }
  - id: verify
    kind: fanout
    over: plan.units
    after: [build]
    step: { kind: agent, role: verifier, context: fresh }
  - id: inspect
    kind: agent
    role: inspector
    when: risk.triggers is not empty
    after: [verify]
  - id: document
    kind: agent
    role: scribe
    after: [verify]
  - id: integrate
    kind: join
    order: lane.ord
    after: [inspect, document]
  - id: ship
    kind: gate
    rule: ready-for-review
    options: [mark_ready, hold]
    defaultIfIgnored: hold
    after: [integrate]
