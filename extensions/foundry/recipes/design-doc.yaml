schemaVersion: 1
id: design-doc
description: >
  A design or strategy document. The order is attacked before a word is
  written, the document is written against the checkout, and a fresh reader
  checks it against the criteria before it ships.
effort: high
requires: []
steps:
  - id: scout
    kind: agent
    role: scout

  # No `challenge` step: the red team attacks the order inside the Forge,
  # before agreement, so a criterion nobody could falsify or a scope the
  # intent never asked for is caught before the writing rather than after —
  # and with a fixed point instead of one re-run per finding. See
  # docs/research/foundry-red-team-loop.md ("Design → Line").
  - id: write
    kind: agent
    role: author
    after: [scout]

  - id: verify
    kind: agent
    role: verifier
    context: fresh
    after: [write]

  - id: integrate
    kind: join
    order: lane.ord
    after: [verify]

  - id: ship
    kind: gate
    rule: ready-for-review
    options: [mark_ready, hold]
    defaultIfIgnored: hold
    after: [integrate]
