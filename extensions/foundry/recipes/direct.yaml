schemaVersion: 1
id: direct
description: >
  One lane. Build it, check it with the project's own tests or a fresh
  verifier, inspect it when something is flagged, document it, ship it.
# One lane: the model's default is enough. The extra thinking is spent on the
# shapes that span lanes or carry risk. Set explicitly, because the default
# differs between models.
effort: medium
requires: []
ci:
  # A red CI goes back to the lane's builder with the failed logs twice, then to you.
  rounds: 2
steps:
  # No `plan` step. The Forge's converge *is* the architect, and the plan it
  # produced is the one the compile gate agreed. Running it again over an
  # agreed order asks for a plan nothing may apply — `applyRungOutput` refuses
  # one from a rung outright — so the step could only end in silence or in a
  # halt. Measured on WO-0907-3c1 it cost 8.2 minutes and did neither.
  - id: build
    kind: fanout
    over: plan.units by lane
    step: { kind: agent, role: builder }
  # Lint runs in the lane, not as a rung of its own: it costs a terminal
  # tab rather than a session, and catching it here is cheaper than a
  # review sending it back.
  - id: lint
    kind: run
    command: '${toolchain.lint}'
    when: toolchain.lint is set
    after: [build]
    onFail: { rework: build, max: 1 }
  # The repository's own test command is the cheapest honest check, so it is
  # used when there is one. A repository with none gets a verifier instead, so
  # the shape never ships with its only check quietly missing.
  - id: check
    kind: run
    command: '${toolchain.test}'
    when: toolchain.test is set
    after: [lint]
    expect: { exit_code: '== 0' }
    onFail: { rework: build, max: 1 }
  # One verifier, not one per unit. A fresh context is what makes verification
  # independent of the work. After `check` rather than beside it: only one of
  # the two ever runs, so waiting on the other costs nothing, and the factory
  # hall cannot lay out a third branch leaving lint.
  - id: verify
    kind: agent
    role: verifier
    when: toolchain.test is not set
    context: fresh
    after: [check]
  - id: inspect
    kind: agent
    role: inspector
    when: risk.triggers is not empty
    after: [check, verify]
  # Beside the check, not after it: the scribe documents what the builder did
  # and needs no verdict. A fresh session, never the builder's — a resumed
  # session keeps its old role's identity. The smallest changes (graded P3)
  # are not worth a documentation pass.
  - id: document
    kind: agent
    role: scribe
    when: risk.grade is not P3
    context: fresh
    after: [lint]
  - id: integrate
    kind: join
    order: lane.ord
    after: [check, verify, inspect, document]
  - id: ship
    kind: gate
    rule: ready-for-review
    options: [mark_ready, hold]
    defaultIfIgnored: hold
    after: [integrate]
