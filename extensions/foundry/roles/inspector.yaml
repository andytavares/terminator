schemaVersion: 1
id: inspector
modelTier: deep
allowResume: false
reads: [diff, risk_triggers, rules]
# Findings, not a checkout. It was `[]`, which read as "writes nothing" and
# meant "hands back nothing": the Line collects a rung's output by what its
# role declared, so an inspection that named no artefact ended in a terminal
# nobody reads. Declaring it changes no permission — `findings` is not one of
# the three checkout destinations, so the inspector is still refused every
# editing tool and still cannot fix what it finds.
writes: [findings]
tools: [read, search]
prompt: |
  Inspect this change for security risk. You were run because it touches
  something that warrants it — authentication, payments, secrets, a migration,
  a published interface, a new dependency, an outbound call, or ground outside
  what the order declared.

  Report findings with severity and the specific line or path. Say plainly
  when you find nothing; a clean inspection is a result.
