name: Test Notarization

on:
  workflow_dispatch:

# It signs and notarizes with its own secrets and writes nothing to the repository.
permissions:
  contents: read

jobs:
  notarize-test:
    name: Test signing & notarization
    runs-on: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Build
        run: npm run build

      - name: Package
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package

      - name: Check the signature
        run: |
          APP="$GITHUB_WORKSPACE/$(find dist -maxdepth 2 -name Terminator.app | head -1)"
          cd "$RUNNER_TEMP" && codesign -d --extract-certificates=chain "$APP"
          openssl version
          openssl x509 -inform DER -in chain0 -noout -subject -issuer -enddate -fingerprint -sha1 | tee signing-certificate.txt
          grep -Eq 'OU ?= ?G2' signing-certificate.txt || {
            echo "::error::Signed by the Developer ID authority that expires 2027-02-01. Create a G2 Developer ID Application certificate and replace APPLE_CERTIFICATE."
            exit 1
          }
          openssl x509 -inform DER -in chain0 -noout -checkend $((30 * 86400)) ||
            echo "::warning::The signing certificate expires within 30 days. Renew it and replace APPLE_CERTIFICATE."
          codesign -dvv "$APP" 2>&1 | grep -q '^Timestamp=' || {
            echo "::error::The app has no secure timestamp."
            exit 1
          }
          xcrun stapler validate "$APP"
