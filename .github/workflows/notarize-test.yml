name: Test Notarization

on:
  workflow_dispatch:

# It signs and notarizes with its own secrets and writes nothing to the repository.
permissions:
  contents: read

jobs:
  notarize-test:
    name: Test signing & notarization
    runs-on: macos-14

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Build
        run: npm run build

      - name: Package
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package

      - name: Check the signature
        run: |
          APP="$GITHUB_WORKSPACE/$(find dist -maxdepth 2 -name Terminator.app | head -1)"
          cd "$RUNNER_TEMP" && codesign -d --extract-certificates=chain "$APP"
          openssl version
          openssl x509 -inform DER -in chain0 -noout -subject -issuer -enddate -fingerprint -sha1 | tee signing-certificate.txt
          grep -Eq 'OU ?= ?G2' signing-certificate.txt || {
            echo "::error::Signed by the Developer ID authority that expires 2027-02-01. Create a G2 Developer ID Application certificate and replace APPLE_CERTIFICATE."
            exit 1
          }
          openssl x509 -inform DER -in chain0 -noout -checkend $((30 * 86400)) ||
            echo "::warning::The signing certificate expires within 30 days. Renew it and replace APPLE_CERTIFICATE."
          codesign -dvv "$APP" 2>&1 | grep -q '^Timestamp=' || {
            echo "::error::The app has no secure timestamp."
            exit 1
          }
          xcrun stapler validate "$APP"
