name: Flake probe (DEBUG-f0c5, throwaway)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.name }} (${{ matrix.copy }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        name: [focus, review-queue, launch]
        copy: [1, 2]
        include:
          - name: focus
            args: tests/e2e/zz-probe-focus.spec.ts --repeat-each 30
          - name: review-queue
            args: tests/e2e/pr-review-queue.spec.ts --repeat-each 12
          - name: launch
            args: tests/e2e/zz-probe-launch.spec.ts --repeat-each 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: |
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app
      - name: Probe
        continue-on-error: true
        env:
          PROBE_RUNS: '30'
        run: npx playwright test ${{ matrix.args }} --workers=2 --retries=0 --reporter=line 2>&1 | tee probe.log
      - name: Summary
        run: |
          grep -E "DEBUG-f0c5|passed|failed|flaky|\) \[electron\]|Error:" probe.log | head -400
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-${{ matrix.name }}-${{ matrix.copy }}
          path: |
            probe.log
            test-results/
          retention-days: 3
