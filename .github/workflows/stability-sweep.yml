name: Stability sweep

# The whole suite, several times on one commit of main, each run with its own seed. A test that
# passes in one run and fails in another is flaky; it gets one open issue (ADR 124). The sweep
# reports and never gates, so its test steps carry on past a failure. The quarantined tests run in
# it too (jobs `quarantine` and `quarantine-e2e`).

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      unit_runs:
        description: Whole unit-suite runs
        default: '5'
      e2e_runs:
        description: Whole e2e-suite runs
        default: '2'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04-arm
    outputs:
      unit_runs: ${{ steps.runs.outputs.unit_runs }}
      e2e_runs: ${{ steps.runs.outputs.e2e_runs }}

    steps:
      - name: Runs
        id: runs
        env:
          UNIT_RUNS: ${{ inputs.unit_runs || '5' }}
          E2E_RUNS: ${{ inputs.e2e_runs || '2' }}
        run: |
          echo "unit_runs=$(seq -s, 1 "$UNIT_RUNS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"
          echo "e2e_runs=$(seq -s, 1 "$E2E_RUNS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit (run ${{ matrix.run }}, ${{ matrix.shard }}/4)
    needs: plan
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.unit_runs) }}
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        continue-on-error: true
        run: |
          npx vitest run --shard=${{ matrix.shard }}/4 --reporter=dot \
            --reporter=json --outputFile.json=sweep/unit-${{ matrix.run }}-${{ matrix.shard }}.json

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-unit-${{ matrix.run }}-${{ matrix.shard }}
          path: sweep/
          retention-days: 7

  e2e:
    name: E2E (run ${{ matrix.run }}, ${{ matrix.shard }}/3)
    needs: plan
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.e2e_runs) }}
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The same code-signature workaround as ci.yml's E2E job.
      - name: Re-sign Electron
        run: |
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app

      - name: Test
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: sweep/e2e-${{ matrix.run }}-${{ matrix.shard }}.json
        run: |
          read -r -a shard <<< "$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 3)"
          npx playwright install chromium
          npx playwright test "${shard[@]}" --reporter=json,dot

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sweep-e2e-${{ matrix.run }}-${{ matrix.shard }}
          path: sweep/
          retention-days: 7

  report:
    name: Report
    needs: [unit, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sweep-*
          path: sweep
          merge-multiple: true

      - name: Flaky and broken tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/flaky-sweep.mjs sweep --open-issues | tee -a "$GITHUB_STEP_SUMMARY"

  # The quarantined tests (tests/quarantine.json, ADR 124), still run, nightly, so a fix shows as
  # passes. Nothing requires this workflow: its result never blocks a pull request.
  quarantine:
    name: Quarantine
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quarantined unit tests
        run: |
          npx vitest run --tagsFilter=quarantine --passWithNoTests --reporter=dot \
            --reporter=junit --outputFile.junit=junit/quarantine.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: junit/quarantine.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The quarantined e2e tests, nightly. Not required (ADR 124).
  quarantine-e2e:
    name: Quarantine (E2E)
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quarantined e2e tests
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit/quarantine-e2e.xml
        run: |
          if [ "$(jq '[.[] | select(.kind == "e2e")] | length' tests/quarantine.json)" = 0 ]; then
            echo "Nothing quarantined in e2e."
            exit 0
          fi
          npm run build
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app
          npx playwright test --grep @quarantine --reporter=dot,junit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: junit/quarantine-e2e.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
