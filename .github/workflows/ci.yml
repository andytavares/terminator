name: CI

# A label change runs it again, so `test: all` takes effect without a push (ADR 123).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job reads the repository and nothing else; none writes with the token.
permissions:
  contents: read

# A new event on a pull request (a push, or the labels Dependabot adds) replaces the run already
# going, so a pull request has one result; every push to main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A change to the lockfile must leave no high or critical advisory (Constitution IV;
      # overrides are listed in docs/CONTRIBUTING.md). A new advisory on an untouched
      # lockfile is the daily audit's (audit.yml): an outside service never gates (ADR 123).
      - name: Security audit
        run: git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- package-lock.json || npm audit --audit-level=high

      # A version this change adds to the lockfile must be 14 days old, unless
      # .release-age-exceptions.json lists it with a reason (scripts/check-release-age.mjs).
      - name: Release age
        run: npm run lint:release-age

      - name: Dependency versions
        run: npm run lint:deps

      # A package that must be single (one editor state, one React) installed twice (#290).
      - name: Single copies
        run: npm run lint:single-copies

      # Quarantined tests: listed, at most 5, at most 7 days, none new to this change (ADR 124).
      - name: Quarantine
        run: npm run lint:quarantine

      # Unused files, exports and dependencies (knip.jsonc, ADR 104).
      - name: Unused code
        run: npm run lint:unused

      # Code that only tests reach: knip's production mode (knip.jsonc, ADR 107).
      - name: Unused production code
        run: npm run lint:unused:production

      # Copy-pasted code in src, packages and extensions (.jscpd.json, ADR 105).
      - name: Duplicate code
        run: npm run lint:duplicates

      - name: Lint
        run: npm run lint

      # The workflows themselves, and the scripts in their run steps, by pinned actionlint and
      # shellcheck (scripts/workflow-lint.mjs): the same binaries here and in ci:local.
      - name: Workflows
        run: npm run lint:workflows

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `tsc --noEmit` on the root tsconfig checks nothing: it is `files: []`
      # plus references, which only `tsc --build` follows. This checks each
      # project by name.
      - name: Typecheck
        run: npm run typecheck

  format:
    name: Format
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # Every story is a test (ADR 098): it renders in Chromium and runs its play
  # function, in the light and the dark theme. The build proves the Storybook
  # site itself still compiles.
  # E2E, the app's start and the story screenshots run on macOS, where Terminator runs; every
  # other job on Ubuntu on ARM, which ci:local runs in a container of the same (ADR 123).
  stories:
    name: Stories
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test stories
        run: npm run test:stories

      - name: Build Storybook
        run: npm run build-storybook

      # The wall-clock budgets (`*.perf.spec.ts`), one file at a time, alone on the runner: in a
      # unit shard they share the CPU with every other spec and measure the load rather than the
      # code. Here and not in Format, because Format is a required check and a budget is not.
      - name: Perf budgets
        run: npm run test:perf

  # Screenshots of every story against the macOS baselines in
  # packages/extension-ui/visual/__screenshots__/darwin (ADR 098): what a Mac draws, so on a Mac.
  # A story with no baseline fails, here and locally alike; the `update-story-baselines` label
  # writes it (.github/workflows/story-baselines.yml).
  story-screenshots:
    name: Story screenshots
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Compare story screenshots
        run: npm run test:visual -w @terminator/extension-ui -- --update-snapshots=none

  # Which tests this change can reach (scripts/test-select.mjs, ADR 123): the same command
  # runs locally. Unit and E2E wait for it and run only what it names, or everything.
  select:
    name: Select tests
    runs-on: ubuntu-24.04-arm
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      run_unit: ${{ steps.select.outputs.run_unit }}
      run_e2e: ${{ steps.select.outputs.run_e2e }}
      e2e_mode: ${{ steps.select.outputs.e2e_mode }}
      e2e_specs: ${{ steps.select.outputs.e2e_specs }}
      shard_count: ${{ steps.select.outputs.shard_count }}
      shards: ${{ steps.select.outputs.shards }}
      stability_shards: ${{ steps.stability.outputs.stability_shards }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Select tests
        id: select
        env:
          TEST_ALL: "${{ contains(github.event.pull_request.labels.*.name, 'test: all') && '1' || '' }}"
        run: |
          node scripts/test-select.mjs | tee /dev/stderr
          node scripts/test-select.mjs --github-output >> "$GITHUB_OUTPUT"

      # Every spec this change adds or edits, 30 times with a fresh seed each, every core busy. One
      # failure fails the check and prints the seed that replays it (ADR 124). Nothing retries. The
      # plan splits the 30 runs, and the specs when there are many, so each shard plans for 3 minutes, in at most 4 shards.
      - name: Size the stability shards
        id: stability
        run: |
          set -o pipefail
          node scripts/stability.mjs --github-output | sed 's/^shards=/stability_shards=/' >> "$GITHUB_OUTPUT"

  # One shard when the selection is under 100 specs, four otherwise. Each shard writes a
  # blob; coverage is limited to the changed files when only some specs run, and is
  # reported once, in the merge.
  unit:
    name: Unit (${{ matrix.shard }}/${{ needs.select.outputs.shard_count }})
    needs: select
    if: needs.select.outputs.run_unit == 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      # Every shard runs to the end, so one run reports every failing spec.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TMPDIR is an empty directory for the run, and the step fails if a spec
      # leaves anything in it (scripts/check-temp-leaks.mjs): specs that never
      # removed their temporary directories once filled a disk with ~22,000.
      - name: Test
        env:
          TEST_ALL: "${{ contains(github.event.pull_request.labels.*.name, 'test: all') && '1' || '' }}"
        run: |
          read -r -a selected <<< "$(node scripts/test-select.mjs --print unit)"
          node scripts/check-temp-leaks.mjs \
            npx vitest run --coverage --shard=${{ matrix.shard }}/${{ needs.select.outputs.shard_count }} \
            "${selected[@]}" --tagsFilter='!quarantine' --reporter=blob --reporter=dot \
            --reporter=junit --outputFile.junit=junit/unit.xml \
            --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 \
            --coverage.thresholds.branches=0 --coverage.thresholds.statements=0

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

      # History for Codecov Test Analytics, failed runs included. It reports; it never gates.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: junit/unit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  stability-shard:
    name: Stability (${{ matrix.shard }}, ${{ matrix.runs }} runs of part ${{ matrix.part }})
    needs: select
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.stability_shards) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Changed specs, this shard
        run: node scripts/stability.mjs --runs ${{ matrix.runs }} --part ${{ matrix.part }}

  # The one Stability check branch protection requires.
  stability:
    name: Stability
    needs: [select, stability-shard]
    if: always()
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Verdict
        run: |
          echo "select: ${{ needs.select.result }}, shards: ${{ needs.stability-shard.result }}"
          test "${{ needs.select.result }}" = success
          test "${{ needs.stability-shard.result }}" = success

  # The required "Test" check. Same OS as the shards, because the blobs carry
  # their absolute source paths and coverage is remapped against them. Green when
  # every shard passed or when the diff needed no unit spec at all.
  test:
    name: Test
    needs: [select, unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        if: needs.unit.result == 'success'
        with:
          pattern: unit-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports and write coverage
        if: needs.unit.result == 'success'
        env:
          TEST_ALL: "${{ contains(github.event.pull_request.labels.*.name, 'test: all') && '1' || '' }}"
        run: |
          read -r -a coverage <<< "$(node scripts/test-select.mjs --print coverage)"
          npx vitest run --merge-reports --coverage "${coverage[@]}" \
            --reporter=dot --reporter=junit --outputFile.junit=test-report.junit.xml

      - name: Upload test report
        if: needs.unit.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-report.junit.xml
          path: test-report.junit.xml
          retention-days: 14

      # An outside service never gates (ADR 123): a Codecov outage is not a test failure.
      - name: Upload coverage to Codecov
        if: needs.unit.result == 'success'
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          files: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      # Runs even when a shard failed, so a shard that died before writing its
      # blob cannot leave a green merge of the others. A failed selection skips
      # every shard, so it is checked too.
      - name: Verdict
        if: always()
        run: |
          test "${{ needs.select.result }}" = success
          case "${{ needs.unit.result }}" in success|skipped) ;; *) exit 1 ;; esac

  # The app started the way a developer starts it, from a clean checkout with no
  # npm cache: `npm run dev`, and `npm run preview` after `npm run build`. A
  # fresh install once could not start at all ("Error: Electron uninstall")
  # while every other job passed, because none of them ran these scripts.
  # scripts/smoke-start.mjs checks for App ready, every extension activated, and
  # no error or uncaught exception, then quits the app.
  start:
    name: Start
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: npm run dev
        run: node scripts/smoke-start.mjs dev

      # A warning is a failure. The ones this catches were real: a renderer
      # bundle with node:fs stubbed out, and chunks past their size budget.
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -nE '\(!\)|\[plugin |\[WARNING\]|⚠|is not exported by|externalized for browser' build.log; then
            echo "::error::npm run build printed the warnings above"
            exit 1
          fi

      - name: npm run preview
        run: node scripts/smoke-start.mjs preview

      # The packaged app from the same electron-builder.cjs the release uses,
      # unsigned and not notarized. It once started with no extensions at all:
      # they were not in app.asar.
      - name: Packaged app
        run: |
          npx electron-builder --mac dir --publish never -c.mac.identity=null -c.mac.notarize=false
          node scripts/smoke-start.mjs exec "$PWD/dist/mac-arm64/Terminator.app/Contents/MacOS/Terminator"

  # Builds its own copy of the app, unless the build cache holds one for this source: the key
  # covers every tracked file but tests, docs and specs, so a change to only those skips it.
  # `Start` runs the build and its warning check on every run.
  e2e:
    name: E2E (${{ matrix.shard }}/3)
    needs: select
    if: needs.select.outputs.run_e2e == 'true'
    runs-on: macos-26
    strategy:
      # Every shard runs to the end, so one run reports every failing spec rather than the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      # Full history: scripts/stability.mjs diffs against origin/<base>.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build cache key
        id: source
        run: |
          echo "hash=$(git ls-tree -r HEAD | grep -v -E $'\t'"(tests|docs|specs)/|/tests/" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Everything `npm run build` writes: out/ (main, preload, renderer, renderer-remote),
      # each extension's bundle and its renderer's dist/.
      - name: Restore the build
        id: build-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            out
            extensions/*/src/index.js
            extensions/*/dist
          key: build-${{ runner.os }}-${{ steps.source.outputs.hash }}

      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build

      # The Electron binary on macOS arm64 can have an invalid code signature
      # (dyld errno=85), causing intermittent "Process failed to launch"
      # failures. Force-extract the binary (install.js is idempotent) and
      # ad-hoc re-sign it before launching the suite.
      - name: Re-sign Electron (macOS arm64 code-signature workaround)
        run: |
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app

      # This user's processes against the per-user limit, before and after each
      # E2E step: what a step leaves running is still there in the next one.
      - name: Process census (before the suite)
        run: scripts/process-census.sh "before the suite"

      # No retries: a test that fails once fails the build. Shards are split by
      # recorded duration (scripts/e2e-shard.mjs), not Playwright's test count.
      - name: Run E2E suite
        env:
          MODE: ${{ needs.select.outputs.e2e_mode }}
          SPECS: ${{ needs.select.outputs.e2e_specs }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: junit/e2e-${{ matrix.shard }}.xml
        run: |
          if [ "$MODE" = all ]; then SPECS=""; fi
          read -r -a specs <<< "$SPECS"
          ARGS=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 3 "${specs[@]}")
          if [ -z "$ARGS" ]; then echo "Nothing selected for this shard."; exit 0; fi
          read -r -a shard <<< "$ARGS"
          # remote-control.spec.ts drives the browser remote renderer in Chromium, and
          # git-integration-contrast.spec.ts and git-integration-stacking.spec.ts
          # render the extension views in it, and design-system-fields.spec.ts renders the shared field styles.
          case "$ARGS" in *remote-control.spec.ts* | *git-integration-contrast.spec.ts* | *git-integration-stacking.spec.ts* | *design-system-fields.spec.ts*) npx playwright install chromium ;; esac
          npx playwright test "${shard[@]}" --grep-invert @quarantine --reporter=blob,dot,junit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: junit/e2e-${{ matrix.shard }}.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # The changed e2e specs, five runs each, this shard's part of them (ADR 124).
      - name: Changed e2e specs, 5 runs, this shard's part
        run: node scripts/stability.mjs --e2e --part ${{ matrix.shard }}/3

      - name: Process census (after the suite)
        if: ${{ !cancelled() }}
        run: scripts/process-census.sh "after the suite"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

      # The app logs git's own words when it cannot answer (git.ipc.ts); Electron writes the log
      # under the runner's real home, not the sealed one, so it is kept here or not at all.
      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log-${{ matrix.shard }}
          path: ~/Library/Logs/@andytavares/terminator/
          retention-days: 14

  # The one E2E check branch protection requires: green when every shard
  # passed or when the diff needed no E2E at all.
  e2e-result:
    name: E2E result
    needs: [select, e2e]
    if: always()
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Verdict
        run: |
          echo "select: ${{ needs.select.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.select.result }}" = success
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac

  # The merged HTML report, for a failed run only, beside the verdict rather than in front of it.
  e2e-report:
    name: E2E report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
