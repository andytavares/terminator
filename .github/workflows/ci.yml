name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gates on what actually ships. Production dependencies must carry no
      # high or critical advisory — that is enforceable and currently clean.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Development tooling is reported but does not fail the build, because it
      # cannot currently be made clean: `eslint-plugin-react` and
      # `electron-winstaller` both still depend on minimatch 3, whose
      # brace-expansion is covered by an advisory that only 5.0.8 satisfies, and
      # 5.x changed its CommonJS export so forcing it breaks them at runtime.
      # Nothing here is shipped to a user. Revisit when those release.
      - name: Security audit (all dependencies, informational)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npx eslint . --ext .ts,.tsx

  typecheck:
    name: Typecheck
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:coverage
        timeout-minutes: 10

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report.junit.xml
          path: test-report.junit.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  build:
    name: Build
    needs: [lint, typecheck, format, test]
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            out/
            extensions/*/src/index.js
          retention-days: 1

  e2e:
    name: E2E
    needs: build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # The Electron binary on macOS arm64 can have an invalid code signature
      # (dyld errno=85), causing intermittent "Process failed to launch"
      # failures. Force-extract the binary (install.js is idempotent) and
      # ad-hoc re-sign it before launching the suite.
      - name: Re-sign Electron (macOS arm64 code-signature workaround)
        run: |
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Run E2E suite
        run: npx playwright test
        timeout-minutes: 15

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
