name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Every dependency, shipped or tooling, must carry no high or critical
      # advisory (Constitution IV). Overrides used to reach patched versions are
      # listed with their advisories in docs/CONTRIBUTING.md.
      - name: Security audit
        run: npm audit --audit-level=high

      # A version this change adds to the lockfile must be 14 days old, unless
      # .release-age-exceptions.json lists it with a reason (scripts/check-release-age.mjs).
      - name: Release age
        run: npm run lint:release-age

      - name: Dependency versions
        run: npm run lint:deps

      # Unused files, exports and dependencies (knip.jsonc, ADR 104).
      - name: Unused code
        run: npm run lint:unused

      # Code that only tests reach: knip's production mode (knip.jsonc, ADR 107).
      - name: Unused production code
        run: npm run lint:unused:production

      # Copy-pasted code in src, packages and extensions (.jscpd.json, ADR 105).
      - name: Duplicate code
        run: npm run lint:duplicates

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `tsc --noEmit` on the root tsconfig checks nothing: it is `files: []`
      # plus references, which only `tsc --build` follows. This checks each
      # project by name.
      - name: Typecheck
        run: npm run typecheck

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # Every story is a test (ADR 098): it renders in Chromium and runs its play
  # function, in the light and the dark theme. The build proves the Storybook
  # site itself still compiles.
  # On macOS, where Terminator runs: it ships only as a macOS DMG, and the
  # screenshots below are compared with baselines made on macOS.
  stories:
    name: Stories
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Test stories
        run: npm run test:stories
        timeout-minutes: 5

      - name: Build Storybook
        run: npm run build-storybook

      # Screenshots of every story against the macOS baselines in
      # packages/extension-ui/visual/__screenshots__/darwin (ADR 098). A story
      # with no baseline fails and gets one written here
      # (--update-snapshots=missing); the step below uploads them so they can be
      # reviewed and committed.
      - name: Compare story screenshots
        run: npm run test:visual -w @terminator/extension-ui -- --update-snapshots=missing
        timeout-minutes: 5

      - name: Upload new baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-baselines-macos
          path: packages/extension-ui/visual/__screenshots__/darwin/
          if-no-files-found: ignore
          retention-days: 14

  # On Linux runners, though the app is macOS-only: GitHub allows five macOS
  # jobs at once, and those go to the jobs that drive the real app (Start,
  # Stories, E2E). Tests of macOS behaviour pin
  # process.platform rather than inheriting the host's. Each shard writes a
  # blob; the coverage threshold only means something over the whole suite, so
  # it is enforced once, in the merge.
  unit:
    name: Unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one run reports every failing spec rather than the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The supervised-runner specs run each command under /bin/sh and /bin/zsh.
      - name: Install zsh
        run: command -v zsh || (sudo apt-get update -qq && sudo apt-get install -y -qq zsh)

      # TMPDIR is an empty directory for the run, and the step fails if a spec
      # leaves anything in it (scripts/check-temp-leaks.mjs): specs that never
      # removed their temporary directories once filled a disk with ~22,000.
      - name: Test
        run: >-
          node scripts/check-temp-leaks.mjs
          npx vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob --reporter=dot
          --coverage.thresholds.lines=0 --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
        timeout-minutes: 5

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # The wall-clock budgets (`*.perf.spec.ts`), one file at a time in a job of
  # their own: in the unit shards they share the CPU with every other spec and
  # measure the load rather than the code.
  perf:
    name: Perf budgets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Perf budgets
        run: npm run test:perf
        timeout-minutes: 5

  # The required "Test" check. Same OS as the shards, because the blobs carry
  # their absolute source paths and coverage is remapped against them.
  test:
    name: Test
    needs: unit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: unit-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports and write coverage
        run: >-
          npx vitest run --merge-reports --coverage --reporter=dot --reporter=junit
          --outputFile.junit=test-report.junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report.junit.xml
          path: test-report.junit.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      # Runs even when a shard failed, so a shard that died before writing its
      # blob cannot leave a green merge of the other two.
      - name: Verdict
        if: always()
        run: test "${{ needs.unit.result }}" = success

  # Nothing the build does depends on the other checks, and E2E waits on it,
  # so it starts with them rather than five minutes after them. Merge still
  # needs every job.
  # The build check. Each E2E shard builds for itself, so nothing waits on this.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A warning is a failure. The ones this catches were real: a renderer
      # bundle with node:fs stubbed out, and chunks past their size budget.
      - name: Build
        run: |
          npm run build 2>&1 | tee build.log
          if grep -nE '\(!\)|\[plugin |\[WARNING\]|⚠|is not exported by|externalized for browser' build.log; then
            echo "::error::npm run build printed the warnings above"
            exit 1
          fi

  # The app started the way a developer starts it, from a clean checkout with no
  # npm cache: `npm run dev`, and `npm run preview` after `npm run build`. A
  # fresh install once could not start at all ("Error: Electron uninstall")
  # while every other job passed, because none of them ran these scripts.
  # scripts/smoke-start.mjs checks for App ready, every extension activated, and
  # no error or uncaught exception, then quits the app.
  start:
    name: Start
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: npm run dev
        run: node scripts/smoke-start.mjs dev
        timeout-minutes: 8

      - name: npm run build
        run: npm run build

      - name: npm run preview
        run: node scripts/smoke-start.mjs preview
        timeout-minutes: 8

      # The packaged app from the same electron-builder.cjs the release uses,
      # unsigned and not notarized. It once started with no extensions at all:
      # they were not in app.asar.
      - name: Packaged app
        run: |
          npx electron-builder --mac dir --publish never -c.mac.identity=null -c.mac.notarize=false
          node scripts/smoke-start.mjs exec "$PWD/dist/mac-arm64/Terminator.app/Contents/MacOS/Terminator"
        timeout-minutes: 15

  e2e-select:
    name: E2E select
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      specs: ${{ steps.select.outputs.specs }}
      changed: ${{ steps.select.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Which specs this diff can affect: scripts/e2e-select.mjs. A push to main
      # runs everything, and any path the map does not know runs everything.
      - name: Select specs
        id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          result=$(node scripts/e2e-select.mjs "$BASE")
          echo "$result"
          echo "mode=$(echo "$result" | jq -r .mode)" >> "$GITHUB_OUTPUT"
          echo "specs=$(echo "$result" | jq -r '.specs | join(" ")')" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'tests/e2e/*.spec.ts' | tr '\n' ' ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Builds its own copy of the app rather than waiting on the Build job: the
  # build takes 40s, the wait for the Build job and its artifact took 1m20s.
  e2e:
    name: E2E (${{ matrix.shard }}/5)
    needs: e2e-select
    if: needs.e2e-select.outputs.mode != 'none'
    runs-on: macos-14
    strategy:
      # Every shard runs to the end, so one run reports every failing spec rather than the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The Electron binary on macOS arm64 can have an invalid code signature
      # (dyld errno=85), causing intermittent "Process failed to launch"
      # failures. Force-extract the binary (install.js is idempotent) and
      # ad-hoc re-sign it before launching the suite.
      - name: Re-sign Electron (macOS arm64 code-signature workaround)
        run: |
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app

      # This user's processes against the per-user limit, before and after each
      # E2E step: what a step leaves running is still there in the next one.
      - name: Process census (before the suite)
        run: scripts/process-census.sh "before the suite"

      # No retries: a test that fails once fails the build. Shards are split by
      # recorded duration (scripts/e2e-shard.mjs), not Playwright's test count.
      - name: Run E2E suite
        env:
          MODE: ${{ needs.e2e-select.outputs.mode }}
          SPECS: ${{ needs.e2e-select.outputs.specs }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        run: |
          if [ "$MODE" = all ]; then SPECS=""; fi
          ARGS=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 5 $SPECS)
          if [ -z "$ARGS" ]; then echo "Nothing selected for this shard."; exit 0; fi
          # remote-control.spec.ts drives the browser remote renderer in Chromium, and
          # git-integration-contrast.spec.ts and git-integration-stacking.spec.ts
          # render the extension views in it, and design-system-fields.spec.ts renders the shared field styles.
          case "$ARGS" in *remote-control.spec.ts* | *git-integration-contrast.spec.ts* | *git-integration-stacking.spec.ts* | *design-system-fields.spec.ts*) npx playwright install chromium ;; esac
          npx playwright test $ARGS --reporter=blob,dot
        timeout-minutes: 10

      - name: Process census (after the suite)
        if: ${{ !cancelled() }}
        run: scripts/process-census.sh "after the suite"

      # A new or edited spec must pass three times before it merges: once in the
      # suite above and twice here, split across the shards the same way.
      - name: Burn in changed specs
        if: needs.e2e-select.outputs.changed != ''
        run: |
          ARGS=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 5 ${{ needs.e2e-select.outputs.changed }})
          if [ -z "$ARGS" ]; then echo "Nothing changed on this shard."; exit 0; fi
          case "$ARGS" in *remote-control.spec.ts* | *git-integration-contrast.spec.ts* | *git-integration-stacking.spec.ts* | *design-system-fields.spec.ts*) npx playwright install chromium ;; esac
          npx playwright test $ARGS --repeat-each=2 --reporter=dot
        timeout-minutes: 10

      - name: Process census (after the burn-in)
        if: ${{ !cancelled() && needs.e2e-select.outputs.changed != '' }}
        run: scripts/process-census.sh "after the burn-in"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # The one E2E check branch protection requires: green when every shard
  # passed or when the diff needed no E2E at all.
  e2e-result:
    name: E2E result
    needs: [e2e-select, e2e]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verdict
        run: |
          echo "select: ${{ needs.e2e-select.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.e2e-select.result }}" = success
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac

  # The merged HTML report, beside the verdict rather than in front of it.
  e2e-report:
    name: E2E report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
