name: CI

on:
  push:
    branches: [main]
  # Every pull request, stacked ones included, whatever branch it targets.
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # No job installs the pre-commit hook: the release's version-bump commit would rerun every check
  # (https://typicode.github.io/husky/how-to.html, "CI server and Docker").
  HUSKY: 0

# Every job reads the repository and nothing else, except the release, which asks for what it
# writes (contents: write) itself.
permissions:
  contents: read

# A new push to a pull request replaces the run already going; every push to main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A pull request runs, on Ubuntu, the tasks of the packages its change reaches and replays a passed
# task whose inputs are unchanged; a push to main runs everything with --force, then the macOS job
# (Start and the @mac specs), then the release (Constitution XIV, ADR 154). Nothing retries. The
# pre-commit hook runs the same Turborepo tasks (package.json, scripts check:repo and check:packages).
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Turborepo's results and Prettier's, kept between runs. A miss only means the task runs.
      - name: Restore task results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo
            node_modules/.cache/prettier
          key: tasks-${{ runner.os }}-${{ github.sha }}
          restore-keys: tasks-${{ runner.os }}-

      # A change to the lockfile must leave no high or critical advisory (Constitution IV;
      # overrides are listed in docs/CONTRIBUTING.md).
      - name: Security audit
        run: git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- package-lock.json || npm audit --audit-level=high

      # syncpack, knip, jscpd, the workflows, Prettier, and the root's own lint, typecheck and specs.
      # TMPDIR is an empty directory for the run, and the step fails if a spec leaves anything in it
      # (scripts/check-temp-leaks.mjs).
      - name: Repository checks
        run: node scripts/check-temp-leaks.mjs npm run check:repo

      # Each package's lint, typecheck and specs with coverage: on a pull request the packages the
      # change reaches against its base branch, on main every package with nothing replayed.
      - name: Package checks
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
          SCOPE: ${{ github.event_name == 'push' && '--force' || '--affected' }}
        run: node scripts/check-temp-leaks.mjs npm run check:packages:ci -- "$SCOPE"

      # An outside service never gates: a Codecov outage is not a test failure. Each package that ran
      # or replayed its specs left coverage/lcov.info; the uploader finds them all.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # Every story renders in Chromium and runs its play function, in both themes (ADR 098), when the
  # design system is reached. The build proves the Storybook site still compiles.
  stories:
    name: Stories
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reached by the change
        id: reach
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
        run: echo "run=$(node scripts/affected.mjs @terminator/extension-ui ${{ github.event_name == 'push' && '--all' || '' }})" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.reach.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        if: steps.reach.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.reach.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Test stories
        if: steps.reach.outputs.run == 'true'
        run: npm run test:stories

      - name: Build Storybook
        if: steps.reach.outputs.run == 'true'
        run: npm run build-storybook

  # Screenshots of every story against the Linux baselines in
  # packages/extension-ui/visual/__screenshots__/linux (ADR 098, ADR 154). A story with no baseline
  # fails; the `update-story-baselines` label writes it (.github/workflows/story-baselines.yml).
  story-screenshots:
    name: Story screenshots
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reached by the change
        id: reach
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
        run: echo "run=$(node scripts/affected.mjs @terminator/extension-ui ${{ github.event_name == 'push' && '--all' || '' }})" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.reach.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        if: steps.reach.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.reach.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        if: steps.reach.outputs.run == 'true'
        run: npm run build-storybook

      - name: Compare story screenshots
        if: steps.reach.outputs.run == 'true'
        run: npm run test:visual -w @terminator/extension-ui -- --update-snapshots=none

  # The Playwright suite in three shards under a virtual display: on a pull request the specs the
  # change reaches (scripts/e2e-select.mjs), on main all of them. The specs tagged @mac run in the
  # macOS job on main. No retries (playwright.config.ts): a test that fails once fails the build.
  e2e:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04-arm
    strategy:
      # Every shard runs to the end, so one run reports every failing spec rather than the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Specs the change reaches
        id: select
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref || 'main' }}
        run: echo "specs=$(node scripts/e2e-select.mjs ${{ github.event_name == 'push' && '--all' || '' }} | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.select.outputs.specs != ''
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # A virtual display for Electron and Chromium, and zsh, which the terminal specs start.
      - name: Install system packages
        if: steps.select.outputs.specs != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb zsh

      - name: Install dependencies
        if: steps.select.outputs.specs != ''
        run: npm ci

      - name: Build
        if: steps.select.outputs.specs != ''
        run: npm run build && npm run pretest:e2e

      # Some specs drive a plain Chromium: the browser remote renderer and the extension views.
      - name: Install Chromium
        if: steps.select.outputs.specs != ''
        run: npx playwright install --with-deps chromium

      # The display is larger than the 1280×800 window every spec lays out (tests/e2e/helpers.ts).
      # Chromium's sandbox needs a setuid helper or user namespaces the runner does not grant.
      - name: Run E2E suite
        if: steps.select.outputs.specs != ''
        env:
          SPECS: ${{ steps.select.outputs.specs }}
          E2E_ELECTRON_ARGS: --no-sandbox
        run: |
          # SPECS is a list of paths; word splitting passes one argument per spec.
          # shellcheck disable=SC2086
          xvfb-run -a --server-args='-screen 0 1920x1080x24' npx playwright test $SPECS --grep-invert @mac --shard=${{ matrix.shard }}/3 --workers=2 --reporter=dot --pass-with-no-tests

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # On a push to main, once the Ubuntu jobs pass: the app started the way a developer starts it
  # (`npm run dev`, `npm run preview` after `npm run build`), the packaged app, and the specs tagged
  # @mac. scripts/smoke-start.mjs checks for App ready, every extension activated, and no error.
  mac:
    name: macOS
    needs: [check, stories, story-screenshots, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: npm run dev
        run: node scripts/smoke-start.mjs dev

      # A warning is a failure. The ones this catches were real: a renderer
      # bundle with node:fs stubbed out, and chunks past their size budget.
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -nE '\(!\)|\[plugin |\[WARNING\]|⚠|is not exported by|externalized for browser' build.log; then
            echo "::error::npm run build printed the warnings above"
            exit 1
          fi

      - name: npm run preview
        run: node scripts/smoke-start.mjs preview

      # The packaged app from the same electron-builder.cjs the release uses, unsigned and not
      # notarized. It once started with no extensions at all: they were not in app.asar.
      - name: Packaged app
        run: |
          npx electron-builder --mac dir --publish never -c.mac.identity=null -c.mac.notarize=false
          node scripts/smoke-start.mjs exec "$PWD/dist/mac-arm64/Terminator.app/Contents/MacOS/Terminator"

      # The Electron binary on macOS arm64 can have an invalid code signature (dyld errno=85).
      # Force-extract the binary (install.js is idempotent) and ad-hoc re-sign it first.
      - name: Re-sign Electron (macOS arm64 code-signature workaround)
        run: |
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run the @mac specs
        run: npx playwright test --grep @mac --workers=2 --reporter=dot --pass-with-no-tests

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-mac
          path: test-results/
          retention-days: 14

  # A push to main that passes every check is released (ADR 134). The bump commit's [skip ci]
  # keeps it from releasing itself. One release at a time; a pushed merge waiting behind another
  # is released with the next one.
  release:
    name: Package & Release
    needs: [check, stories, story-screenshots, e2e, mac]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.11'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      # The app always; each extension changed since the last release tag too.
      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A merge during the tests moved main; the push needs its tip.
          git pull --rebase origin main
          npm version patch --no-git-tag-version
          node scripts/bump-extension-versions.mjs
          git add package.json package-lock.json extensions/*/package.json extensions/*/manifest.json
          git commit -m "chore: bump version [skip ci]"
          git push

      - name: Build
        run: npm run build

      - name: Package
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package

      - name: Check the signature
        run: |
          APP="$GITHUB_WORKSPACE/$(find dist -maxdepth 2 -name Terminator.app | head -1)"
          cd "$RUNNER_TEMP" && codesign -d --extract-certificates=chain "$APP"
          openssl version
          openssl x509 -inform DER -in chain0 -noout -subject -issuer -enddate -fingerprint -sha1 | tee signing-certificate.txt
          grep -Eq 'OU ?= ?G2' signing-certificate.txt || {
            echo "::error::Signed by the Developer ID authority that expires 2027-02-01. Create a G2 Developer ID Application certificate and replace APPLE_CERTIFICATE."
            exit 1
          }
          openssl x509 -inform DER -in chain0 -noout -checkend $((30 * 86400)) ||
            echo "::warning::The signing certificate expires within 30 days. Renew it and replace APPLE_CERTIFICATE."
          codesign -dvv "$APP" 2>&1 | grep -q '^Timestamp=' || {
            echo "::error::The app has no secure timestamp."
            exit 1
          }
          xcrun stapler validate "$APP"

      - name: Check the update feed
        # Installed apps read latest-mac.yml to find this release; without it they stay on the old one.
        run: ls dist/*.zip dist/*.blockmap dist/latest-mac.yml

      - name: Get version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The notes are the "## Release notes" section of the merged pull request's description.
      - name: Release notes from the merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}' > pr.json
          jq -r '.body // ""' pr.json | tr -d '\r' |
            awk '/^## /{ on = tolower($0) ~ /^## release notes[[:space:]]*$/; next } on' |
            sed '/^[[:space:]]*<!--.*-->[[:space:]]*$/d' > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::warning::The merged pull request has no Release notes section. The release uses its title."
            jq -r '.title // empty' pr.json > release_notes.md
            grep -q . release_notes.md || git log -1 --format=%s "${{ github.sha }}" > release_notes.md
          fi
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          token: ${{ secrets.GITHUB_TOKEN }}

  release-cleanup:
    name: Delete old releases
    needs: release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Delete old GitHub releases (keep last 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName \
            --jq '.[5:][].tagName' | \
          while read -r tag; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
