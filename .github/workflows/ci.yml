name: CI

on:
  push:
    branches: [main]
  # Every pull request, stacked ones included, whatever branch it targets.
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job reads the repository and nothing else, except the release, which asks for what it
# writes (contents: write) itself.
permissions:
  contents: read

# A new push to a pull request replaces the run already going; every push to main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs on Ubuntu except the ones that need a Mac: the app (Start, E2E), the story
# screenshots (the baselines are macOS renders) and the signed release. Every run tests everything,
# once, with no retry (ADR 151). The pre-commit hook runs the same npm scripts (npm run check).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A change to the lockfile must leave no high or critical advisory (Constitution IV;
      # overrides are listed in docs/CONTRIBUTING.md).
      - name: Security audit
        run: git diff --quiet "$(git merge-base origin/main HEAD)" HEAD -- package-lock.json || npm audit --audit-level=high

      # One exact version per dependency (syncpack), and no second copy of a package that must
      # be single, one editor state and one React (scripts/check-single-copies.mjs, #290).
      - name: Dependencies
        run: npm run lint:deps

      # Unused files, exports and dependencies (knip.jsonc, ADR 104).
      - name: Unused code
        run: npm run lint:unused

      # Copy-pasted code in src, packages and extensions (.jscpd.json, ADR 105).
      - name: Duplicate code
        run: npm run lint:duplicates

      - name: Lint
        run: npm run lint

      # The workflows themselves, and the scripts in their run steps, by pinned actionlint and
      # shellcheck (scripts/workflow-lint.mjs).
      - name: Workflows
        run: npm run lint:workflows

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  format:
    name: Format
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # Every story is a test (ADR 098): it renders in Chromium and runs its play function, in the
  # light and the dark theme. The build proves the Storybook site itself still compiles.
  stories:
    name: Stories
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test stories
        run: npm run test:stories

      - name: Build Storybook
        run: npm run build-storybook

  # Screenshots of every story against the macOS baselines in
  # packages/extension-ui/visual/__screenshots__/darwin (ADR 098): what a Mac draws, so on a Mac.
  # A story with no baseline fails; the `update-story-baselines` label writes it
  # (.github/workflows/story-baselines.yml).
  story-screenshots:
    name: Story screenshots
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Compare story screenshots
        run: npm run test:visual -w @terminator/extension-ui -- --update-snapshots=none

  # The whole Vitest suite, once, with coverage. Codecov's codecov/patch check reads the coverage.
  test:
    name: Test
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TMPDIR is an empty directory for the run, and the step fails if a spec leaves anything in
      # it (scripts/check-temp-leaks.mjs): specs that never removed their temporary directories
      # once filled a disk with ~22,000.
      - name: Test
        run: node scripts/check-temp-leaks.mjs npm test -- --coverage

      # An outside service never gates: a Codecov outage is not a test failure.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          files: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # The app started the way a developer starts it, from a clean checkout with no
  # npm cache: `npm run dev`, and `npm run preview` after `npm run build`. A
  # fresh install once could not start at all ("Error: Electron uninstall")
  # while every other job passed, because none of them ran these scripts.
  # scripts/smoke-start.mjs checks for App ready, every extension activated, and
  # no error or uncaught exception, then quits the app.
  start:
    name: Start
    runs-on: macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: npm run dev
        run: node scripts/smoke-start.mjs dev

      # A warning is a failure. The ones this catches were real: a renderer
      # bundle with node:fs stubbed out, and chunks past their size budget.
      - name: npm run build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -nE '\(!\)|\[plugin |\[WARNING\]|⚠|is not exported by|externalized for browser' build.log; then
            echo "::error::npm run build printed the warnings above"
            exit 1
          fi

      - name: npm run preview
        run: node scripts/smoke-start.mjs preview

      # The packaged app from the same electron-builder.cjs the release uses,
      # unsigned and not notarized. It once started with no extensions at all:
      # they were not in app.asar.
      - name: Packaged app
        run: |
          npx electron-builder --mac dir --publish never -c.mac.identity=null -c.mac.notarize=false
          node scripts/smoke-start.mjs exec "$PWD/dist/mac-arm64/Terminator.app/Contents/MacOS/Terminator"

  # The whole Playwright suite in three shards (Playwright's --shard), each from a fresh build.
  # No retries (playwright.config.ts): a test that fails once fails the build.
  e2e:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: macos-26
    strategy:
      # Every shard runs to the end, so one run reports every failing spec rather than the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The Electron binary on macOS arm64 can have an invalid code signature
      # (dyld errno=85), causing intermittent "Process failed to launch"
      # failures. Force-extract the binary (install.js is idempotent) and
      # ad-hoc re-sign it before launching the suite.
      - name: Re-sign Electron (macOS arm64 code-signature workaround)
        run: |
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app

      # Some specs drive a plain Chromium: the browser remote renderer and the extension views.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run E2E suite
        run: npx playwright test --shard=${{ matrix.shard }}/3 --workers=2 --reporter=dot

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

      # The app logs git's own words when it cannot answer (git.ipc.ts); Electron writes the log
      # under the runner's real home, not the sealed one, so it is kept here or not at all.
      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-log-${{ matrix.shard }}
          path: ~/Library/Logs/@andytavares/terminator/
          retention-days: 14

  # A push to main that passes every check is released (ADR 134). The bump commit's [skip ci]
  # keeps it from releasing itself. One release at a time; a pushed merge waiting behind another
  # is released with the next one.
  release:
    name: Package & Release
    needs: [lint, typecheck, format, stories, story-screenshots, test, start, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.11'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      # The app always; each extension changed since the last release tag too.
      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A merge during the tests moved main; the push needs its tip.
          git pull --rebase origin main
          npm version patch --no-git-tag-version
          node scripts/bump-extension-versions.mjs
          git add package.json package-lock.json extensions/*/package.json extensions/*/manifest.json
          git commit -m "chore: bump version [skip ci]"
          git push

      - name: Build
        run: npm run build

      - name: Package
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package

      - name: Check the signature
        run: |
          APP="$GITHUB_WORKSPACE/$(find dist -maxdepth 2 -name Terminator.app | head -1)"
          cd "$RUNNER_TEMP" && codesign -d --extract-certificates=chain "$APP"
          openssl version
          openssl x509 -inform DER -in chain0 -noout -subject -issuer -enddate -fingerprint -sha1 | tee signing-certificate.txt
          grep -Eq 'OU ?= ?G2' signing-certificate.txt || {
            echo "::error::Signed by the Developer ID authority that expires 2027-02-01. Create a G2 Developer ID Application certificate and replace APPLE_CERTIFICATE."
            exit 1
          }
          openssl x509 -inform DER -in chain0 -noout -checkend $((30 * 86400)) ||
            echo "::warning::The signing certificate expires within 30 days. Renew it and replace APPLE_CERTIFICATE."
          codesign -dvv "$APP" 2>&1 | grep -q '^Timestamp=' || {
            echo "::error::The app has no secure timestamp."
            exit 1
          }
          xcrun stapler validate "$APP"

      - name: Check the update feed
        # Installed apps read latest-mac.yml to find this release; without it they stay on the old one.
        run: ls dist/*.zip dist/*.blockmap dist/latest-mac.yml

      - name: Get version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The notes are the "## Release notes" section of the merged pull request's description.
      - name: Release notes from the merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}' > pr.json
          jq -r '.body // ""' pr.json | tr -d '\r' |
            awk '/^## /{ on = tolower($0) ~ /^## release notes[[:space:]]*$/; next } on' |
            sed '/^[[:space:]]*<!--.*-->[[:space:]]*$/d' > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::warning::The merged pull request has no Release notes section. The release uses its title."
            jq -r '.title // empty' pr.json > release_notes.md
            grep -q . release_notes.md || git log -1 --format=%s "${{ github.sha }}" > release_notes.md
          fi
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          token: ${{ secrets.GITHUB_TOKEN }}

  release-cleanup:
    name: Delete old releases
    needs: release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Delete old GitHub releases (keep last 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName \
            --jq '.[5:][].tagName' | \
          while read -r tag; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
