name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gates on what actually ships. Production dependencies must carry no
      # high or critical advisory — that is enforceable and currently clean.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Development tooling is reported but does not fail the build, because it
      # cannot currently be made clean: `eslint-plugin-react` and
      # `electron-winstaller` both still depend on minimatch 3, whose
      # brace-expansion is covered by an advisory that only 5.0.8 satisfies, and
      # 5.x changed its CommonJS export so forcing it breaks them at runtime.
      # Nothing here is shipped to a user. Revisit when those release.
      - name: Security audit (all dependencies, informational)
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npx eslint . --ext .ts,.tsx

  typecheck:
    name: Typecheck
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The root typecheck references only main, renderer and shared, so
      # extension code was never checked at all and type errors in it reached
      # a green build.
      - name: Typecheck extensions
        run: npm run typecheck:extensions

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:coverage
        timeout-minutes: 10

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report.junit.xml
          path: test-report.junit.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # Nothing the build does depends on the other checks, and E2E waits on it,
  # so it starts with them rather than five minutes after them. Merge still
  # needs every job.
  build:
    name: Build
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: |
            out/
            extensions/*/src/index.js
            # The extensions' renderer bundles. Without these an extension's UI
            # is "Not found: dist/index.html" in the E2E job while passing
            # locally, which is exactly the gap the panel test exists to close.
            extensions/*/dist/
          retention-days: 1

  e2e-select:
    name: E2E select
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      specs: ${{ steps.select.outputs.specs }}
      changed: ${{ steps.select.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Which specs this diff can affect: scripts/e2e-select.mjs. A push to main
      # runs everything, and any path the map does not know runs everything.
      - name: Select specs
        id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          result=$(node scripts/e2e-select.mjs "$BASE")
          echo "$result"
          echo "mode=$(echo "$result" | jq -r .mode)" >> "$GITHUB_OUTPUT"
          echo "specs=$(echo "$result" | jq -r '.specs | join(" ")')" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'tests/e2e/*.spec.ts' | tr '\n' ' ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.shard }}/2)
    needs: [build, e2e-select]
    if: needs.e2e-select.outputs.mode != 'none'
    runs-on: macos-14
    strategy:
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The Electron binary on macOS arm64 can have an invalid code signature
      # (dyld errno=85), causing intermittent "Process failed to launch"
      # failures. Force-extract the binary (install.js is idempotent) and
      # ad-hoc re-sign it before launching the suite.
      - name: Re-sign Electron (macOS arm64 code-signature workaround)
        run: |
          node node_modules/electron/install.js
          codesign --force --deep --sign - node_modules/electron/dist/Electron.app

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      # No retries: a test that fails once fails the build.
      - name: Run E2E suite
        env:
          MODE: ${{ needs.e2e-select.outputs.mode }}
          SPECS: ${{ needs.e2e-select.outputs.specs }}
        run: |
          if [ "$MODE" = all ]; then SPECS=""; fi
          npx playwright test $SPECS --shard=${{ matrix.shard }}/2 --pass-with-no-tests --reporter=blob,dot
        timeout-minutes: 10

      # A new or edited spec must pass three times in a row before it merges.
      - name: Burn in changed specs
        if: matrix.shard == 1 && needs.e2e-select.outputs.changed != ''
        run: npx playwright test ${{ needs.e2e-select.outputs.changed }} --repeat-each=3 --reporter=dot
        timeout-minutes: 10

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # The one E2E check branch protection requires: green when every shard
  # passed or when the diff needed no E2E at all.
  e2e-result:
    name: E2E result
    needs: [e2e-select, e2e]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: needs.e2e.result != 'skipped'
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        if: needs.e2e.result != 'skipped'
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: HTML report
        if: needs.e2e.result != 'skipped'
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        if: needs.e2e.result != 'skipped'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Verdict
        run: |
          echo "select: ${{ needs.e2e-select.result }}, e2e: ${{ needs.e2e.result }}"
          test "${{ needs.e2e-select.result }}" = success
          case "${{ needs.e2e.result }}" in success|skipped) ;; *) exit 1 ;; esac
